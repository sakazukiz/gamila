name: Build NFSU2 Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'NFSU2-Android-*.part*'
      - 'GITHUB_ACTIONS_BUILD.yml'
      - 'ci/android-runtime-hardening.patch.zlib.b64'
      - 'ci/patch_android_xbox_address_map.py'
      - '.github/workflows/android-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout build bootstrap
        uses: actions/checkout@v4

      - name: Reassemble project archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(NFSU2-Android-*.part*)
          if (( ${#parts[@]} < 2 )); then
            echo "Expected the two NFSU2 archive parts in the repository root."
            exit 1
          fi
          cat "${parts[@]}" > NFSU2-Android-SDL-Integration-Stage.zip
          unzip -t NFSU2-Android-SDL-Integration-Stage.zip
          unzip -q NFSU2-Android-SDL-Integration-Stage.zip -d "$RUNNER_TEMP/nfsu2"
          echo "PROJECT_DIR=$RUNNER_TEMP/nfsu2/nfsu2-android-work2" >> "$GITHUB_ENV"

      - name: Apply Android runtime and Xbox memory-layout hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/ci/android-runtime-hardening.patch.zlib.b64" "$PROJECT_DIR" <<'PY'
          import base64, pathlib, subprocess, sys, zlib
          encoded = pathlib.Path(sys.argv[1]).read_text().strip()
          patch = zlib.decompress(base64.b64decode(encoded))
          result = subprocess.run(
              ["patch", "--batch", "--forward", "-p1", "-d", sys.argv[2]],
              input=patch, check=True
          )
          print(f"Applied runtime hardening patch: {len(patch)} bytes")
          PY

      - name: Patch Android shared-memory compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/xboxrecomp/src/platform/win32_compat.c" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          if "#include <linux/memfd.h>" not in s:
              anchor = "#include <unistd.h>"
              if anchor not in s:
                  raise SystemExit("Cannot locate unistd include in win32_compat.c")
              s = s.replace(anchor, anchor + "\n#if defined(__ANDROID__)\n#include <sys/syscall.h>\n#include <linux/memfd.h>\n#endif", 1)
          start = s.find("static int anon_map_fd(const char *name)")
          if start < 0:
              raise SystemExit("anon_map_fd function not found")
          end_marker = "\nHANDLE CreateFileMappingA"
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit("CreateFileMappingA boundary not found")
          replacement = """static int anon_map_fd(const char *name)
          {
          #if defined(__ANDROID__)
              /* Bionic does not expose shm_open; use Linux memfd syscall. */
          #ifndef SYS_memfd_create
          #ifdef __NR_memfd_create
          #define SYS_memfd_create __NR_memfd_create
          #endif
          #endif
          #ifdef SYS_memfd_create
              return (int)syscall(SYS_memfd_create, name ? name : "xbox_map", MFD_CLOEXEC);
          #else
              errno = ENOSYS;
              return -1;
          #endif
          #elif defined(__APPLE__)
              static volatile LONG map_counter = 0;
              char shm_name[64];
              LONG seq = InterlockedIncrement(&map_counter);
              snprintf(shm_name, sizeof(shm_name), "/nfsu2_map_%ld_%ld",
                       (long)getpid(), (long)seq);
              int fd = shm_open(shm_name, O_CREAT | O_RDWR | O_EXCL, 0600);
              if (fd >= 0) shm_unlink(shm_name);
              (void)name;
              return fd;
          #else
              return memfd_create(name ? name : "xbox_map", 0);
          #endif
          }
          """
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          print("Patched", p)
          PY

      - name: Harden Android Xbox virtual-address map
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ci/patch_android_xbox_address_map.py" "$PROJECT_DIR"

      - name: Add Android SAF launcher and game import
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PYCODE'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = root / "android/app/src/main/AndroidManifest.xml"
          manifest.write_text("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="NFS Underground 2" android:hasCode="true"
                  android:allowBackup="false" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name="com.nfsu2.recomp.LauncherActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <activity android:name="org.libsdl.app.SDLActivity" android:configChanges="keyboard|keyboardHidden|orientation|screenSize|uiMode|density|navigation"
                      android:exported="false" android:screenOrientation="sensorLandscape" />
              </application>
          </manifest>""")
          gradle = root / "android/app/build.gradle"
          g = gradle.read_text()
          if "abiFilters 'arm64-v8a'" not in g:
              raise SystemExit("Expected ARM64 ABI filter missing from build.gradle")
          g = g.replace("abiFilters 'arm64-v8a'", "abiFilters 'arm64-v8a', 'x86_64'", 1)
          if "androidx.documentfile:documentfile" not in g:
              g += "\ndependencies { implementation 'androidx.documentfile:documentfile:1.0.1' }\n"
          gradle.write_text(g)
          java = root / "android/app/src/main/java/com/nfsu2/recomp/LauncherActivity.java"
          java.parent.mkdir(parents=True, exist_ok=True)
          java.write_text(r'''package com.nfsu2.recomp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.documentfile.provider.DocumentFile;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public final class LauncherActivity extends Activity {
              private static final int PICK_GAME_FOLDER = 7102;
              private final ExecutorService worker = Executors.newSingleThreadExecutor();
              private TextView status;
              private Button start;
              private File gameDir;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  gameDir = new File(getFilesDir(), "game");
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(32, 32, 32, 32);
                  root.setBackgroundColor(0xff101820);
                  TextView title = new TextView(this);
                  title.setText("NEED FOR SPEED\\nUNDERGROUND 2");
                  title.setTextColor(0xffffffff); title.setTextSize(26); title.setGravity(Gravity.CENTER);
                  root.addView(title, new LinearLayout.LayoutParams(-1, -2));
                  status = new TextView(this); status.setTextColor(0xffdddddd); status.setTextSize(14);
                  status.setGravity(Gravity.CENTER); status.setPadding(0, 24, 0, 24);
                  root.addView(status, new LinearLayout.LayoutParams(-1, -2));
                  Button pick = new Button(this); pick.setText("IMPORT FOLDER NFSU2");
                  root.addView(pick, new LinearLayout.LayoutParams(-1, -2));
                  start = new Button(this); start.setText("START GAME");
                  root.addView(start, new LinearLayout.LayoutParams(-1, -2));
                  setContentView(root);
                  // CI-only path: exercise the same private SDLActivity launch used by START GAME.
                  if ((getApplicationInfo().flags & android.content.pm.ApplicationInfo.FLAG_DEBUGGABLE) != 0 &&
                      getIntent().getBooleanExtra("com.nfsu2.recomp.CI_SMOKE_NATIVE", false)) {
                      root.postDelayed(() -> startActivity(
                          new Intent(LauncherActivity.this, org.libsdl.app.SDLActivity.class)), 750);
                  }
                  pick.setOnClickListener(v -> chooseFolder());
                  start.setOnClickListener(v -> launchGame());
                  refreshState();
              }

              private void refreshState() {
                  boolean valid = new File(gameDir, "default.xbe").isFile();
                  start.setEnabled(valid);
                  status.setText(valid ? "Folder game siap. Tekan START GAME." : "Import folder hasil ekstrak NFSU2 yang berisi default.xbe.");
              }

              private void chooseFolder() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(i, PICK_GAME_FOLDER);
              }

              @Override protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request != PICK_GAME_FOLDER || result != RESULT_OK || data == null || data.getData() == null) return;
                  Uri tree = data.getData();
                  try { getContentResolver().takePersistableUriPermission(tree, Intent.FLAG_GRANT_READ_URI_PERMISSION); }
                  catch (SecurityException e) { status.setText("Izin folder tidak dapat disimpan: " + e.getMessage()); return; }
                  DocumentFile source = DocumentFile.fromTreeUri(this, tree);
                  DocumentFile xbe = source == null ? null : source.findFile("default.xbe");
                  if (xbe == null || !xbe.isFile()) {
                      new AlertDialog.Builder(this).setMessage("Folder tidak valid. Pilih folder yang langsung berisi default.xbe.").setPositiveButton("OK", null).show();
                      return;
                  }
                  start.setEnabled(false);
                  status.setText("Menyalin file game ke penyimpanan aplikasi. Jangan tutup aplikasi...");
                  worker.execute(() -> {
                      try {
                          if (gameDir.exists()) deleteTree(gameDir);
                          if (!gameDir.mkdirs() && !gameDir.isDirectory()) throw new Exception("Tidak dapat membuat folder game");
                          copyTree(source, gameDir);
                          if (!new File(gameDir, "default.xbe").isFile()) throw new Exception("default.xbe tidak ditemukan setelah penyalinan");
                          runOnUiThread(() -> { status.setText("Import selesai."); refreshState(); });
                      } catch (Exception e) {
                          runOnUiThread(() -> { status.setText("Import gagal: " + e.getMessage()); refreshState(); });
                      }
                  });
              }

              private void copyTree(DocumentFile source, File target) throws Exception {
                  if (source.isDirectory()) {
                      if (!target.exists() && !target.mkdirs()) throw new Exception("Gagal membuat folder " + target.getName());
                      for (DocumentFile child : source.listFiles()) {
                          String name = child.getName();
                          if (name == null || name.equals(".") || name.equals("..")) continue;
                          copyTree(child, new File(target, name));
                      }
                  } else if (source.isFile()) {
                      try (InputStream in=getContentResolver().openInputStream(source.getUri());
                           OutputStream out=new FileOutputStream(target)) {
                          if (in == null) throw new Exception("Tidak bisa membaca " + source.getName());
                          byte[] buffer=new byte[1024*1024]; int n;
                          while ((n=in.read(buffer)) != -1) if (n > 0) out.write(buffer,0,n);
                      }
                  }
              }

              private static void deleteTree(File f) {
                  if (f.isDirectory()) { File[] children=f.listFiles(); if (children != null) for (File c:children) deleteTree(c); }
                  //noinspection ResultOfMethodCallIgnored
                  f.delete();
              }

              private void launchGame() {
                  if (!new File(gameDir, "default.xbe").isFile()) { refreshState(); return; }
                  startActivity(new Intent(this, org.libsdl.app.SDLActivity.class));
              }

              @Override protected void onDestroy() { worker.shutdown(); super.onDestroy(); }
          }
          ''')
          print("Installed SAF launcher, folder validation and private-storage import")
          PYCODE

      - name: Enable AndroidX for SAF document picker
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/android/gradle.properties" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          p.parent.mkdir(parents=True, exist_ok=True)
          s = p.read_text() if p.exists() else ""
          for key in ("android.useAndroidX=true", "android.enableJetifier=true"):
              name = key.split("=", 1)[0]
              lines = [line for line in s.splitlines() if not line.startswith(name + "=")]
              lines.append(key)
              s = "\n".join(lines) + "\n"
          p.write_text(s)
          print("Enabled AndroidX in", p)
          PY

      - name: Install host regression-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libepoxy-dev

      - name: Run Xbox memory-layout regression tests
        shell: bash
        run: |
          set -euo pipefail
          STUB="$RUNNER_TEMP/android-stub"
          mkdir -p "$STUB/android"
          cat > "$STUB/android/log.h" <<'EOF'
          #pragma once
          #define ANDROID_LOG_INFO 4
          #define ANDROID_LOG_ERROR 6
          static inline int __android_log_print(int priority, const char *tag, const char *format, ...) {
              (void)priority; (void)tag; (void)format; return 0;
          }
          EOF
          cmake -S "$PROJECT_DIR/xboxrecomp/tests/memory_layout_posix" \
            -B "$RUNNER_TEMP/memory-layout-test" -G Ninja \
            -DCMAKE_C_FLAGS="-D__ANDROID__ -I$STUB" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/memory-layout-test" --target memory_layout_posix_test --parallel 2
          ctest --test-dir "$RUNNER_TEMP/memory-layout-test" --output-on-failure

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n1)"
          fi
          test -n "$SDKMANAGER"
          # sdkmanager may close stdin after accepting licenses; `yes` then
          # exits with SIGPIPE. Capture sdkmanager's status, not `yes` status.
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          if [[ "$sdkmanager_status" -ne 0 ]]; then
            echo "sdkmanager --licenses failed with exit code $sdkmanager_status"
            exit "$sdkmanager_status"
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
          test -d "$SDK/ndk/27.3.13750724"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon -p android :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-contents.txt"
          grep -Fq 'lib/arm64-v8a/libmain.so' "$RUNNER_TEMP/apk-contents.txt"
          grep -Fq 'lib/x86_64/libmain.so' "$RUNNER_TEMP/apk-contents.txt"
          grep -Fq 'lib/arm64-v8a/libSDL2.so' "$RUNNER_TEMP/apk-contents.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.nfsu2.recomp'"

      - name: Enable KVM permissions for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm

      - name: Prepare Android smoke-test script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nfsu2-smoke-test.sh" <<'SMOKE'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          PACKAGE="com.nfsu2.recomp"
          ACTIVITY="com.nfsu2.recomp/com.nfsu2.recomp.LauncherActivity"

          adb devices -l
          adb wait-for-device
          BOOT="$(adb shell getprop sys.boot_completed | head -n 1 | xargs)"
          if [[ "$BOOT" != "1" ]]; then
            echo "Emulator has not completed boot"
            adb logcat -d -t 3000
            exit 1
          fi

          ABI_LIST="$(adb shell getprop ro.product.cpu.abilist | head -n 1 | xargs)"
          echo "Emulator ABI list: $ABI_LIST"
          grep -q 'x86_64' <<< "$ABI_LIST"

          adb install -r "$APK"
          adb shell pm path "$PACKAGE"
          adb logcat -c
          adb shell am force-stop "$PACKAGE"
          adb shell am start -W -n "$ACTIVITY" --ez com.nfsu2.recomp.CI_SMOKE_NATIVE true
          sleep 10

          PID="$(adb shell pidof "$PACKAGE" | head -n 1 | xargs)"
          adb logcat -d -v time > "$RUNNER_TEMP/nfsu2-native-logcat.txt"
          if [[ -z "$PID" ]]; then
            cat "$RUNNER_TEMP/nfsu2-native-logcat.txt"
            echo "Application process exited after SDL launch"
            exit 1
          fi

          grep -F 'SDL_MAIN_STARTED' "$RUNNER_TEMP/nfsu2-native-logcat.txt"
          grep -F 'GAME_DATA_MISSING' "$RUNNER_TEMP/nfsu2-native-logcat.txt"
          if grep -E 'FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGBUS|SIGABRT' "$RUNNER_TEMP/nfsu2-native-logcat.txt"; then
            cat "$RUNNER_TEMP/nfsu2-native-logcat.txt"
            echo "Native SDL startup crashed"
            exit 1
          fi
          echo "PASS: launcher, SDLActivity, libmain.so and native missing-data guard all ran without crash."
          SMOKE
          chmod +x "$RUNNER_TEMP/nfsu2-smoke-test.sh"

      - name: Android launcher and native smoke test (API 35 x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          script: bash "$RUNNER_TEMP/nfsu2-smoke-test.sh"

      - name: Upload APK and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Android-ARM64
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14
