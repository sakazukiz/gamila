name: Build NFSU2 Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'NFSU2-Android-*.part*'
      - 'GITHUB_ACTIONS_BUILD.yml'
      - '.github/workflows/android-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout build bootstrap
        uses: actions/checkout@v4

      - name: Reassemble project archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(NFSU2-Android-*.part*)
          if (( ${#parts[@]} < 2 )); then
            echo "Expected the two NFSU2 archive parts in the repository root."
            exit 1
          fi
          cat "${parts[@]}" > NFSU2-Android-SDL-Integration-Stage.zip
          unzip -t NFSU2-Android-SDL-Integration-Stage.zip
          unzip -q NFSU2-Android-SDL-Integration-Stage.zip -d "$RUNNER_TEMP/nfsu2"
          echo "PROJECT_DIR=$RUNNER_TEMP/nfsu2/nfsu2-android-work2" >> "$GITHUB_ENV"

      - name: Patch Android shared-memory compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/xboxrecomp/src/platform/win32_compat.c" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          if "#include <linux/memfd.h>" not in s:
              anchor = "#include <unistd.h>"
              if anchor not in s:
                  raise SystemExit("Cannot locate unistd include in win32_compat.c")
              s = s.replace(anchor, anchor + "\n#if defined(__ANDROID__)\n#include <sys/syscall.h>\n#include <linux/memfd.h>\n#endif", 1)
          start = s.find("static int anon_map_fd(const char *name)")
          if start < 0:
              raise SystemExit("anon_map_fd function not found")
          end_marker = "\nHANDLE CreateFileMappingA"
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit("CreateFileMappingA boundary not found")
          replacement = """static int anon_map_fd(const char *name)
          {
          #if defined(__ANDROID__)
              /* Bionic does not expose shm_open; use Linux memfd syscall. */
          #ifndef SYS_memfd_create
          #ifdef __NR_memfd_create
          #define SYS_memfd_create __NR_memfd_create
          #endif
          #endif
          #ifdef SYS_memfd_create
              return (int)syscall(SYS_memfd_create, name ? name : "xbox_map", MFD_CLOEXEC);
          #else
              errno = ENOSYS;
              return -1;
          #endif
          #elif defined(__APPLE__)
              static volatile LONG map_counter = 0;
              char shm_name[64];
              LONG seq = InterlockedIncrement(&map_counter);
              snprintf(shm_name, sizeof(shm_name), "/nfsu2_map_%ld_%ld",
                       (long)getpid(), (long)seq);
              int fd = shm_open(shm_name, O_CREAT | O_RDWR | O_EXCL, 0600);
              if (fd >= 0) shm_unlink(shm_name);
              (void)name;
              return fd;
          #else
              return memfd_create(name ? name : "xbox_map", 0);
          #endif
          }
          """
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          print("Patched", p)
          PY

      - name: Add Android game-folder access
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = root / "android/app/src/main/AndroidManifest.xml"
          m = manifest.read_text()
          perm = '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />'
          if "MANAGE_EXTERNAL_STORAGE" not in m:
              m = m.replace('    <uses-permission android:name="android.permission.INTERNET" />',
                            '    <uses-permission android:name="android.permission.INTERNET" />\\n' + perm)
          m = m.replace('android:name="org.libsdl.app.SDLActivity"',
                        'android:name="com.nfsu2.recomp.NFSU2Activity"')
          manifest.write_text(m)
          java = root / "android/app/src/main/java/com/nfsu2/recomp/NFSU2Activity.java"
          java.parent.mkdir(parents=True, exist_ok=True)
          java.write_text("""package com.nfsu2.recomp;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import org.libsdl.app.SDLActivity;
          public class NFSU2Activity extends SDLActivity {
              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  if (Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) {
                      new AlertDialog.Builder(this)
                          .setTitle("Akses folder game diperlukan")
                          .setMessage("Izinkan akses semua file agar NFSU2 dapat membaca /storage/emulated/0/NFSU2/default.xbe. Setelah memberi izin, buka ulang game.")
                          .setCancelable(false)
                          .setPositiveButton("Buka pengaturan", (d, w) -> {
                              Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                  Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                          })
                          .setNegativeButton("Nanti", (d, w) -> {})
                          .show();
                  }
              }
          }
          """)
          main = root / "src/main.c"
          s = main.read_text()
          old = '    if (!game_dir || !game_dir[0])\\n        game_dir = NFSU2_DEFAULT_GAME_DIR;'
          new = '''    if (!game_dir || !game_dir[0]) {
          #if defined(__ANDROID__)
              if (access("/storage/emulated/0/NFSU2/default.xbe", R_OK) == 0)
                  game_dir = "/storage/emulated/0/NFSU2";
              else
          #endif
                  game_dir = NFSU2_DEFAULT_GAME_DIR;
          }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '"/storage/emulated/0/NFSU2/default.xbe"' not in s:
              raise SystemExit("Could not locate Android game directory fallback in src/main.c")
          main.write_text(s)
          print("Added MANAGE_EXTERNAL_STORAGE prompt and /NFSU2 lookup")
          PY

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n1)"
          fi
          test -n "$SDKMANAGER"
          # sdkmanager may close stdin after accepting licenses; `yes` then
          # exits with SIGPIPE. Capture sdkmanager's status, not `yes` status.
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          if [[ "$sdkmanager_status" -ne 0 ]]; then
            echo "sdkmanager --licenses failed with exit code $sdkmanager_status"
            exit "$sdkmanager_status"
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
          test -d "$SDK/ndk/27.3.13750724"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon -p android :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Android-ARM64
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14
